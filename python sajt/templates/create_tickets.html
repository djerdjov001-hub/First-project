<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <title>Novi Ticket</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 20px;
            background: #e8f5e9;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎫 Novi IT Ticket</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Naslov problema:</label>
        <input
            type="text"
            name="title"
            placeholder="Npr. Računar se ne uključuje"
            required
        >

        <label>Opis problema:</label>
        <textarea
            name="description"
            rows="8"
            placeholder="Opiši problem što detaljnije..."
            required
        ></textarea>

        <label>Kategorija:</label>
        <select name="category" required>
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Network">Network</option>
            <option value="Account">Account</option>
            <option value="Other">Other</option>
        </select>

        <label>Prioritet:</label>
        <select name="priority" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
        </select>

        <button type="submit">
            Kreiraj Ticket
        </button>

    </form>

    <a href="/dashboard">← Nazad na Dashboard</a>

</div>

</body>
</html>
